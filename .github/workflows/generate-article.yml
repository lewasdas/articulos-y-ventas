name: Generate Daily Article

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-article.js

      - name: Commit and push article
        run: |
          git config user.name "auto-blog-bot"
          git config user.email "bot@auto-blog.com"
          git add content/articles/
          git diff --staged --quiet || git commit -m "feat: add daily article $(date +'%Y-%m-%d')"
          git push
